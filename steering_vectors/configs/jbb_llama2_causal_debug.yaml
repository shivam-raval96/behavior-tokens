# Causal diagnostic for the saved JBB jailbreak steering direction.
# The source run supplies both the fixed direction and selected-layer probe.
model_id: meta-llama/Llama-2-7b-chat-hf
dataset: JailbreakBench/JBB-Behaviors
dataset_config: behaviors
source_run_dir: steering_vectors/runs/2026-08-04_225000Z_jbb-llama2-chat-direction
evaluation_examples: 50
temperature: 0.5
max_new_tokens: 64
generation_seed: 0
generation_batch_size: 4
checkpoint_every: 5
seed: 0

# 350 main generations: fixed vector, injected throughout generation.
main_scales: [-6, -4, -2, 0, 2, 4, 6]

# 200 matched, paired causal controls at +6: random/shuffled directions and
# timing-only variants of the saved direction.
control_scale: 6
control_direction_kinds: [random_norm_matched, coordinate_shuffled]
timing_modes: [prefill_only, decode_only]
output_dir: steering_vectors/runs/2026-08-05_001536Z_jbb-llama2-causal-steering-debug
