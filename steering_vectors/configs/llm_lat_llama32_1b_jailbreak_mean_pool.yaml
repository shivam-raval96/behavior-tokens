model_id: meta-llama/Llama-3.2-1B-Instruct
dataset: LLM-LAT/harmful-dataset
split: train

# Each pair becomes prompt+chosen benign response (label 0) and
# prompt+rejected harmful response (label 1). Both stay in the same split.
pair_count: 500
train_pairs: 400
data_seed: 0
split_seed: 0
activation_pooling: response_mean

# GPU batching applies to activation extraction and every hooked sweep pass.
activation_batch_size: 32
checkpoint_every: 32
sweep_strengths: [-6, -4, -2, 0, 2, 4, 6]
probability_threshold: 0.75

# Keep generation settings identical to isolate activation pooling.
generations_per_strength: 10
generation_batch_size: 10
generation_seed: 0
temperature: 0.7
top_p: 0.9
max_new_tokens: 128
