model_id: meta-llama/Llama-3.2-1B-Instruct
dataset: LLM-LAT/harmful-dataset
split: train

# Split by pair so chosen/rejected responses from one prompt never leak.
pair_count: 500
train_pairs: 400
data_seed: 0
split_seed: 0

# Parallel work happens inside GPU batches. All seven classifier sweeps are
# evaluated together from the cached held-out residual states.
activation_batch_size: 16
checkpoint_every: 32
sweep_strengths: [-6, -4, -2, 0, 2, 4, 6]
probability_threshold: 0.75

# Exactly ten generations are made at each strength whose mean held-out
# harmful-pair jailbreak probability is at least probability_threshold.
generations_per_strength: 10
generation_batch_size: 10
generation_seed: 0
temperature: 0.7
top_p: 0.9
max_new_tokens: 128
