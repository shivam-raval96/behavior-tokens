# Sadness-persona steering experiment
concept: sadness

model_name: unsloth/Llama-3.2-1B-Instruct
device: auto
dtype: bfloat16
layer: 8

dataset_name: shiv96/convsersations_sadness_large
split: train
n_samples: 1000
prompt_key: prompt
response_key: response
label_key: label
pos_label: 1
neg_label: -1

pooling: last
normalize: true
batch_size: 16

clf_test_frac: 0.2
clf_C: 1.0
seed: 0

eval_n_prompts: 100
curve_min: -2.0
curve_max: 2.0
curve_step: 1.0
max_new_tokens: 64
gen_temperature: 0.0

output_dir: outputs

# GCG (for later steering.run_gcg on this concept)
gcg_suffix_len: 16
gcg_steps: 100
gcg_topk: 256
gcg_search_batch: 32
gcg_target_scale: 3.0
gcg_objective: project
gcg_n_prompts: 2
gcg_init_token: " !"
gcg_seed: 0
