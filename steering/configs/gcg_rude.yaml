# Lighter GCG config for MPS — same steering identity (concept/layer/pooling) so
# it reuses the rude_L8_mean checkpoint (steering vector + classifier).
concept: rude
model_name: unsloth/Llama-3.2-1B-Instruct
device: mps
dtype: float32
layer: 8
pooling: mean
n_samples: 1000
batch_size: 16
output_dir: steering/outputs

# behavioral eval (held-out prompts)
eval_n_prompts: 40
max_new_tokens: 48

# GCG — sized for MPS throughput (~few s/step)
gcg_suffix_len: 16
gcg_steps: 100
gcg_topk: 256
gcg_search_batch: 32
gcg_target_scale: 3.0
gcg_objective: project     # drive ⟨Δ,v⟩ -> target_scale (behaviorally relevant)
gcg_n_prompts: 2
gcg_init_token: " !"
gcg_seed: 0
