# Rude-persona steering experiment
concept: rude

# Ungated mirror of meta-llama/Llama-3.2-1B-Instruct (identical weights).
model_name: unsloth/Llama-3.2-1B-Instruct
device: auto
dtype: float32
layer: 8

dataset_name: shiv96/convsersations_rude_large
split: train
n_samples: 1000
prompt_key: prompt
response_key: response
label_key: label
pos_label: 1
neg_label: -1

pooling: mean
normalize: true
batch_size: 16

clf_test_frac: 0.2
clf_C: 1.0
seed: 0

eval_n_prompts: 100
curve_min: -2.0
curve_max: 2.0
curve_step: 1.0
max_new_tokens: 64
gen_temperature: 0.0

output_dir: steering/outputs

# ---- GCG suffix optimization (steering.run_gcg) ----
gcg_suffix_len: 20
gcg_steps: 250
gcg_topk: 256
gcg_search_batch: 128
gcg_target_scale: 3.0      # reproduce steering at this scale via input tokens
gcg_n_prompts: 4           # optimize a shared suffix over N prompts (transfer)
gcg_init_token: " !"
gcg_seed: 0
