<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terminal Wrench Trajectory Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --muted:#8b949e; --text:#e6edf3; --blue:#58a6ff; --red:#ff7b72; --green:#56d364; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,sans-serif }
    header { position:sticky; top:0; z-index:2; padding:18px 24px; background:#0d1117ee; border-bottom:1px solid var(--line); backdrop-filter:blur(8px) }
    h1 { margin:0 0 12px; font-size:21px } .toolbar { display:flex; gap:8px; flex-wrap:wrap }
    button,input,select { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px }
    button { cursor:pointer } button:hover { border-color:var(--blue) } input[type=search] { flex:1; min-width:240px }
    main { max-width:1400px; margin:auto; padding:20px 24px } #status { color:var(--muted); margin-bottom:14px }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:16px }
    .stat,.record { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px }
    .stat strong { display:block; font-size:22px } .record { margin-bottom:12px }
    .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px } .pill { padding:2px 7px; border:1px solid var(--line); border-radius:999px; color:var(--muted) }
    .hack { color:var(--red) } .baseline { color:var(--green) } details { margin-top:8px } summary { cursor:pointer; color:var(--blue) }
    .step { border-left:3px solid var(--line); padding:8px 12px; margin:10px 0; background:#0d1117 } .step.agent { border-color:var(--blue) } .step.user { border-color:var(--green) }
    .role { font-weight:700; text-transform:uppercase; font-size:11px; color:var(--muted) } pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:6px 0; font:12px/1.45 ui-monospace,monospace }
    .pager { display:flex; justify-content:center; align-items:center; gap:12px; margin:18px } .hidden { display:none }
  </style>
</head>
<body>
  <header><h1>Terminal Wrench sanitized trajectories + baselines</h1><div class="toolbar">
    <button id="loadDefault">Load nearby JSON</button><button id="pick">Choose JSON file</button><input id="file" type="file" accept="application/json,.json" hidden>
    <select id="classFilter"><option value="">All classes</option><option value="sanitized_hack">Sanitized hacks</option><option value="baseline">Baselines</option></select>
    <select id="modelFilter"><option value="">All source models</option></select><input id="search" type="search" placeholder="Search task, label, ID, model, or message text…">
  </div></header>
  <main><div id="status">Load the dataset to begin. For direct file use, click “Choose JSON file.”</div><section id="stats" class="stats hidden"></section><section id="records"></section><div id="pager" class="pager hidden"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></main>
<script>
const PAGE_SIZE=20, DEFAULT_JSON='terminal_wrench_sanitized_and_baselines.json';
let rows=[], filtered=[], page=0;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function textOf(x){ if(typeof x==='string') return x; try{return JSON.stringify(x,null,2)}catch{return String(x)} }
async function load(blobOrUrl){
  $('status').textContent='Loading and parsing the 186 MB dataset…'; const started=performance.now();
  try { const text=typeof blobOrUrl==='string' ? await (await fetch(blobOrUrl)).text() : await blobOrUrl.text(); const data=JSON.parse(text); rows=data.rows||[];
    const models=[...new Set(rows.map(r=>r.source_model))].sort(); $('modelFilter').innerHTML='<option value="">All source models</option>'+models.map(m=>`<option>${esc(m)}</option>`).join('');
    $('stats').classList.remove('hidden'); $('stats').innerHTML=`<div class="stat"><strong>${rows.length.toLocaleString()}</strong>Total</div><div class="stat"><strong>${rows.filter(r=>r.label===1).length.toLocaleString()}</strong>Sanitized hacks</div><div class="stat"><strong>${rows.filter(r=>r.label===0).length.toLocaleString()}</strong>Baselines</div><div class="stat"><strong>${((performance.now()-started)/1000).toFixed(1)}s</strong>Load time</div>`;
    applyFilters();
  } catch(e){ $('status').textContent=`Could not load dataset: ${e.message}. If this page was opened as a file, use “Choose JSON file.”`; }
}
function haystack(r){return [r.example_id,r.task_id,r.source_model,r.trajectory_label,r.sanitizer_model,...(r.trajectory?.steps||[]).map(s=>textOf(s.message))].join('\n').toLowerCase()}
function applyFilters(){ const cls=$('classFilter').value, model=$('modelFilter').value, q=$('search').value.trim().toLowerCase(); filtered=rows.filter(r=>(!cls||r.class===cls)&&(!model||r.source_model===model)&&(!q||haystack(r).includes(q))); page=0; render() }
function renderStep(s){ const extras={...s}; delete extras.message; delete extras.source; return `<div class="step ${esc(s.source)}"><div class="role">${esc(s.source)} · step ${esc(s.step_id)}</div><pre>${esc(textOf(s.message))}</pre>${Object.keys(extras).length?`<details><summary>Tool calls, observations, and metadata</summary><pre>${esc(textOf(extras))}</pre></details>`:''}</div>` }
function render(){ const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)); page=Math.min(page,pages-1); const shown=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
  $('status').textContent=`Showing ${shown.length ? page*PAGE_SIZE+1 : 0}–${Math.min((page+1)*PAGE_SIZE,filtered.length)} of ${filtered.length.toLocaleString()} matching trajectories.`;
  $('records').innerHTML=shown.map(r=>`<article class="record"><div class="meta"><strong class="${r.label?'hack':'baseline'}">${esc(r.class)}</strong><span class="pill">task ${esc(r.task_id)}</span><span class="pill">${esc(r.source_model)}</span><span class="pill">${esc(r.trajectory_label)}</span>${r.sanitizer_model?`<span class="pill">sanitized by ${esc(r.sanitizer_model)}</span>`:''}<span class="pill">${esc(r.example_id)}</span></div><details><summary>${r.trajectory?.steps?.length||0} steps — expand trajectory</summary>${(r.trajectory?.steps||[]).map(renderStep).join('')}<details><summary>Final metrics</summary><pre>${esc(textOf(r.trajectory?.final_metrics||{}))}</pre></details></details></article>`).join('');
  $('pager').classList.toggle('hidden',!rows.length); $('page').textContent=`Page ${page+1} of ${pages}`; $('prev').disabled=page===0; $('next').disabled=page>=pages-1;
}
$('loadDefault').onclick=()=>load(DEFAULT_JSON); $('pick').onclick=()=>$('file').click(); $('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
$('classFilter').onchange=$('modelFilter').onchange=applyFilters; let timer; $('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(applyFilters,250)};
$('prev').onclick=()=>{page--;render();scrollTo(0,0)}; $('next').onclick=()=>{page++;render();scrollTo(0,0)};
load(DEFAULT_JSON);
</script>
</body></html>
