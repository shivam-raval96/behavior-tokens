<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terminal Wrench Trace Comparison</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e14;--panel:#131821;--line:#293242;--muted:#8c98aa;--text:#e8edf4;--accent:#79b8ff;--user:#61d095;--agent:#bc8cff}*{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;gap:20px;padding:14px 22px;background:#0b0e14f2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .nav,.selectors{display:flex;align-items:end;gap:8px}.selectors label{display:grid;gap:3px;color:var(--muted);font-size:11px;text-transform:uppercase}button,select{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4}.counter{min-width:92px;text-align:center;color:var(--muted)}
    main{max-width:1300px;margin:auto;padding:22px}.task{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;margin-bottom:18px}.task h1{font-size:18px;margin:0 0 8px}.task pre{max-height:300px;overflow:auto}.trace-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}.trace-head h2{font-size:17px;margin:0}.meta{color:var(--muted)}
    .step{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:7px;padding:12px 14px;margin:10px 0;background:var(--panel)}.step.user{border-left-color:var(--user)}.step.agent{border-left-color:var(--agent)}.role{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0;font:12px/1.5 ui-monospace,monospace}details summary{cursor:pointer;color:var(--accent)}#status{color:var(--muted);padding:30px;text-align:center}
    @media(max-width:700px){header{align-items:stretch;flex-direction:column}.nav,.selectors{justify-content:space-between}.selectors label{flex:1}.selectors select{width:100%}main{padding:12px}}
  </style>
</head>
<body>
  <header>
    <div class="nav"><button id="prev">← Previous trace</button><span id="counter" class="counter">—</span><button id="next">Next trace →</button></div>
    <div class="selectors"><label>Model<select id="model"></select></label><label>Response style<select id="style"></select></label></div>
  </header>
  <main><div id="status">Loading five-task comparison…</div><section id="view"></section></main>
  <script src="terminal_wrench_comparison_5_tasks.js"></script>
  <script>
    const DATA='terminal_wrench_comparison_5_tasks.json'; let data,taskIndex=0;
    const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const text=x=>typeof x==='string'?x:JSON.stringify(x,null,2); const title=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
    function stepHTML(step){const rest={...step};delete rest.source;delete rest.message;return `<article class="step ${esc(step.source)}"><div class="role">${esc(step.source)} · step ${esc(step.step_id)}</div><pre>${esc(text(step.message))}</pre>${Object.keys(rest).length?`<details><summary>Tool calls, observations, and metadata</summary><pre>${esc(text(rest))}</pre></details>`:''}</article>`}
    function render(){const task=data.tasks[taskIndex],model=$('model').value,style=$('style').value,item=task.models[model][style],trace=item.trajectory;$('counter').textContent=`${taskIndex+1} / ${data.tasks.length}`;$('prev').disabled=taskIndex===0;$('next').disabled=taskIndex===data.tasks.length-1;
      $('view').innerHTML=`<section class="task"><h1>Task ${esc(task.task_id)}</h1><pre>${esc(task.prompt)}</pre></section><div class="trace-head"><h2>${esc(title(style))} · ${esc(model)}</h2><span class="meta">label ${esc(item.label)} · ${trace.steps?.length||0} steps</span></div>${(trace.steps||[]).map(stepHTML).join('')}<details><summary>Final metrics and source</summary><pre>${esc(text({source_path:item.source_path,final_metrics:trace.final_metrics}))}</pre></details>`;
    }
    async function init(){try{data=window.COMPARISON_DATA||await (await fetch(DATA)).json();$('model').innerHTML=data.models.map(x=>`<option>${esc(x)}</option>`).join('');$('style').innerHTML=data.styles.map(x=>`<option value="${esc(x)}">${esc(title(x))}</option>`).join('');$('status').remove();render()}catch(e){$('status').innerHTML=`Could not preload data: ${esc(e.message)}`}}
    $('prev').onclick=()=>{if(taskIndex){taskIndex--;render();scrollTo(0,0)}};$('next').onclick=()=>{if(taskIndex<data.tasks.length-1){taskIndex++;render();scrollTo(0,0)}};$('model').onchange=$('style').onchange=render;init();
  </script>
</body>
</html>
