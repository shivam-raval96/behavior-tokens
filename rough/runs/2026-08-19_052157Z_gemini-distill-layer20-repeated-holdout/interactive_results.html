<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini-distill layer 20 probe results</title>
<style>:root{color-scheme:light dark;--bg:#f4f1e9;--ink:#18201d;--muted:#65706b;--panel:#fffdf7;--line:#d6d2c8;--train:#2d6a8a;--test:#e07849}@media(prefers-color-scheme:dark){:root{--bg:#111613;--ink:#edf1ec;--muted:#aeb8b2;--panel:#19201c;--line:#374039;--train:#68acd0;--test:#ef956b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px}h1{margin:0 0 6px;font-size:clamp(1.45rem,3vw,2.25rem)}p{margin:0;color:var(--muted)}header{margin-bottom:22px}.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.35fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}h2{font-size:1rem;margin:0 0 15px}.heatmap{display:grid;grid-template-columns:92px repeat(3,minmax(64px,1fr));gap:7px;position:relative}.axis{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.75rem;color:var(--muted);min-height:34px}.rowlab{justify-content:flex-start;color:var(--ink);font-weight:600}.cell{border-radius:10px;min-height:84px;color:#102018;display:flex;flex-direction:column;align-items:center;justify-content:center}.cell strong{font-size:1.3rem}.cell span{font-size:.7rem;opacity:.74}.frame{position:absolute;border:3px solid var(--ink);border-radius:12px;pointer-events:none}.legend{height:9px;border-radius:99px;margin:16px 0 5px;background:linear-gradient(90deg,#f3d9c8,#f1ab75,#77b7ab,#176b62)}.labels,.key{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}.charts{display:grid;gap:18px}.facet{border-top:1px solid var(--line);padding-top:14px}.facet:first-child{border:0;padding:0}.bars{height:155px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;border-bottom:1px solid var(--line)}.group{display:flex;gap:5px;align-items:flex-end;justify-content:center}.bar{width:min(34px,35%);height:calc((var(--v) - .5)*200%);min-height:2px;border-radius:6px 6px 0 0;position:relative;background:var(--train)}.bar.test{background:var(--test)}.bar b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.7rem}.x{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:.72rem;color:var(--muted);padding-top:7px}@media(max-width:790px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><header><h1>Gemini-distill layer 20 cross-model probes</h1><p>Mean accuracy over 10 fixed 70/30 task holdouts · 194 tasks · paired baseline and sanitized trajectories</p></header><div class="grid"><section class="panel"><h2>Held-out test accuracy</h2><div id="hm" class="heatmap"></div><div class="legend"></div><div class="labels"><span>50%</span><span>75%</span><span>100%</span></div></section><section class="panel"><div class="key"><span>Blue: train partition</span><span>Orange: held-out</span></div><div id="charts" class="charts"></div></section></div></main>
<script>const models=["Claude","Gemini","GPT"],rows=[{trainer:"Claude",values:[{train:1,test:.988793,sd:.010790},{train:.650368,test:.634483,sd:.019574},{train:.770221,test:.758621,sd:.052516}]},{trainer:"Gemini",values:[{train:.948529,test:.951724,sd:.026710},{train:1,test:.967241,sd:.010597},{train:.950368,test:.950862,sd:.018197}]},{trainer:"GPT",values:[{train:.779779,test:.772414,sd:.039232},{train:.836765,test:.833621,sd:.040648},{train:1,test:.995690,sd:.006096}]}];function color(v){const a=[243,217,200],b=[23,107,98],t=Math.max(0,Math.min(1,(v-.5)/.5));return`rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*t)).join(',')})`}const hm=document.getElementById('hm');hm.innerHTML='<div></div>'+models.map((m,i)=>`<div class="axis" data-ch="${i}">Test on<br>${m}</div>`).join('');rows.forEach((r,i)=>hm.insertAdjacentHTML('beforeend',`<div class="axis rowlab" data-rl="${i}">Train ${r.trainer}</div>`+r.values.map((v,j)=>`<div class="cell" data-r="${i}" data-c="${j}" style="background:${color(v.test)}"><strong>${(v.test*100).toFixed(1)}%</strong><span>± ${(v.sd*100).toFixed(1)} pp</span></div>`).join('')));hm.insertAdjacentHTML('beforeend','<div id="rf" class="frame"></div><div id="cf" class="frame"></div>');function frame(id,els){const h=hm.getBoundingClientRect(),b=els.map(e=>e.getBoundingClientRect()),l=Math.min(...b.map(x=>x.left))-h.left,t=Math.min(...b.map(x=>x.top))-h.top,r=Math.max(...b.map(x=>x.right))-h.left,d=Math.max(...b.map(x=>x.bottom))-h.top;Object.assign(document.getElementById(id).style,{left:l+'px',top:t+'px',width:r-l+'px',height:d-t+'px'})}function position(){frame('rf',[hm.querySelector('[data-rl="0"]'),...hm.querySelectorAll('[data-r="0"]')]);frame('cf',[hm.querySelector('[data-ch="0"]'),...hm.querySelectorAll('[data-c="0"]')])}requestAnimationFrame(position);addEventListener('resize',position);const charts=document.getElementById('charts');rows.forEach(r=>charts.insertAdjacentHTML('beforeend',`<div class="facet"><b>Probe trained on ${r.trainer}</b><div class="bars">${r.values.map(v=>`<div class="group"><div class="bar" style="--v:${v.train}"><b>${(v.train*100).toFixed(1)}</b></div><div class="bar test" style="--v:${v.test}"><b>${(v.test*100).toFixed(1)}</b></div></div>`).join('')}</div><div class="x">${models.map(m=>`<span>Evaluate ${m}</span>`).join('')}</div></div>`));</script></body></html>
